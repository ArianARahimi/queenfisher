name: Build

# Builds Queenfisher for Linux (AppImage), Windows (zip) and macOS (zip) on every push to
# main. Pushing a version tag (v0.1.0) also puts them on a draft release, which nobody
# sees until it's checked and published by hand.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}

env:
  QT_VERSION: "6.8.3"
  AQT_VERSION: "3.3.0"

jobs:
  linux:
    # The oldest supported Ubuntu, so the AppImage runs on older systems too.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^project(Queenfisher VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          [ "$TAG" = "v$version" ] || { echo "Tag $TAG doesn't match version $version in CMakeLists.txt"; exit 1; }

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libssl-dev libgl1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libegl1 libpulse0
          pip install "aqtinstall==$AQT_VERSION"
          python -m aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -m qtmultimedia -O "$RUNNER_TEMP/Qt"
          echo "$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"

      # Downloads linuxdeploy and its Qt plugin, checked against pinned SHA-256s.
      - name: Build the AppImage
        run: ./packaging/linux/appimage.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: linux
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        shell: bash
        run: |
          choco install openssl --no-progress -y
          pip install "aqtinstall==$AQT_VERSION"
          python -m aqt install-qt windows desktop "$QT_VERSION" win64_msvc2022_64 -m qtmultimedia -O "$RUNNER_TEMP/Qt"

      - name: Build and package
        shell: bash
        run: |
          qt="$RUNNER_TEMP/Qt/$QT_VERSION/msvc2022_64"
          ssl=$(ls -d "/c/Program Files/OpenSSL"* | head -n 1)   # OpenSSL or OpenSSL-Win64
          echo "OpenSSL in $ssl"
          version=$(sed -n 's/^project(Queenfisher VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$qt" -DOPENSSL_ROOT_DIR="$ssl"
          cmake --build build --config Release
          out="dist/Queenfisher-$version-windows"
          mkdir -p "$out"
          cp build/Release/queenfisher.exe "$out/Queenfisher.exe"
          "$qt/bin/windeployqt.exe" --release --no-translations "$out/Queenfisher.exe"
          cp "$ssl"/bin/libcrypto-3-x64.dll "$ssl"/bin/libssl-3-x64.dll "$out/"
          cp LICENSE "$out/LICENSE.txt"
          cd dist && 7z a "Queenfisher-$version-windows.zip" "Queenfisher-$version-windows"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  macos:
    # Apple Silicon only for now (Homebrew's OpenSSL is single-architecture).
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          brew install ninja openssl@3
          pip3 install --break-system-packages "aqtinstall==$AQT_VERSION"
          python3 -m aqt install-qt mac desktop "$QT_VERSION" clang_64 -m qtmultimedia -O "$RUNNER_TEMP/Qt"

      - name: Build and package
        run: |
          qt="$RUNNER_TEMP/Qt/$QT_VERSION/macos"
          version=$(sed -n 's/^project(Queenfisher VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="$qt" -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          cmake --build build
          mv build/queenfisher.app build/Queenfisher.app
          "$qt/bin/macdeployqt" build/Queenfisher.app
          mkdir -p dist
          ditto -c -k --keepParent build/Queenfisher.app "dist/Queenfisher-$version-macos.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: macos
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.ref_type == 'tag'
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # Stays a draft until the files are checked on VirusTotal and it's published by hand.
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          v=${TAG#v}
          # Fixed names too, for the website's download buttons (releases/latest/download/<name>).
          cp "dist/Queenfisher-$v-x86_64.AppImage" dist/Queenfisher-Linux.AppImage
          cp "dist/Queenfisher-$v-windows.zip" dist/Queenfisher-Windows.zip
          cp "dist/Queenfisher-$v-macos.zip" dist/Queenfisher-macOS.zip
          cd dist
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS
          gh release create "$TAG" * --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Queenfisher $v" --notes-file - <<EOF
          **Linux:** download \`Queenfisher-$v-x86_64.AppImage\`, make it executable (\`chmod +x\`) and run it. Needs ffmpeg installed; YouTube also needs Deno.

          **Windows (untested):** download \`Queenfisher-$v-windows.zip\`, unpack it and run \`Queenfisher.exe\`.

          **macOS, Apple Silicon (untested):** download \`Queenfisher-$v-macos.zip\`, open it and open **Queenfisher**. The first time, macOS blocks it: System Settings → Privacy & Security → **Open Anyway**. Needs ffmpeg (\`brew install ffmpeg\`).

          SHA-256 checksums are in \`SHA256SUMS\`.
          EOF
