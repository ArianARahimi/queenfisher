name: Build

# Every push to main: builds Queenfisher for Linux (AppImage), Windows (one .exe) and macOS (zips),
# checks every file on VirusTotal, and puts them on the "latest-build" pre-release for testing.
# A commit titled "Release vX.Y.Z" (matching the version in CMakeLists.txt) also publishes
# release vX.Y.Z. Nothing is published that VirusTotal flags.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}

env:
  QT_VERSION: "6.8.3"
  AQT_VERSION: "3.3.0"

jobs:
  linux:
    # The oldest supported Ubuntu, so the AppImage runs on older systems too.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libssl-dev libgl1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libegl1 libpulse0
          pip install "aqtinstall==$AQT_VERSION"
          python -m aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O "$RUNNER_TEMP/Qt"
          echo "$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"

      # Downloads linuxdeploy and its Qt plugin, checked against pinned SHA-256s.
      - name: Build the AppImage
        run: ./packaging/linux/appimage.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: linux
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 30

  windows:
    # One Queenfisher.exe and nothing else, cross-built against static Qt and OpenSSL. Arch
    # pinned to one day's packages: the same MinGW and host Qt the build is tested with.
    runs-on: ubuntu-24.04
    timeout-minutes: 120   # the first run builds Qt; later runs reuse it from the cache
    container: archlinux:base-devel
    steps:
      - name: Install build tools
        run: |
          echo 'Server = https://archive.archlinux.org/repos/2026/11/16/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm --needed mingw-w64-gcc qt6-base cmake ninja perl git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/static/prefix
          key: static-qt-${{ hashFiles('packaging/windows/build-static.sh') }}

      - name: Build Queenfisher.exe
        run: ./packaging/windows/build-static.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

  macos:
    # One build per Mac kind: Homebrew's OpenSSL is single-architecture, so no universal app.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64, suffix: macos, name: macos-arm64 }
          - { runner: macos-15-intel, arch: x86_64, suffix: macos-intel, name: macos-intel }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          brew install ninja openssl@3
          pip3 install --break-system-packages "aqtinstall==$AQT_VERSION"
          python3 -m aqt install-qt mac desktop "$QT_VERSION" clang_64 -O "$RUNNER_TEMP/Qt"

      - name: Build and package
        env:
          ARCH: ${{ matrix.arch }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          qt="$RUNNER_TEMP/Qt/$QT_VERSION/macos"
          version=$(sed -n 's/^project(Queenfisher VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="$ARCH" \
            -DCMAKE_PREFIX_PATH="$qt" -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          cmake --build build
          mv build/queenfisher.app build/Queenfisher.app
          "$qt/bin/macdeployqt" build/Queenfisher.app
          mkdir -p dist
          ditto -c -k --keepParent build/Queenfisher.app "dist/Queenfisher-$version-$SUFFIX.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 90   # VirusTotal can take a while with new files
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Check every file on VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: python3 -I tools/vt-check.py dist/*

      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS

      # For trying a change before it's released; replaced on every push.
      - name: Latest build (pre-release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest-build dist/* --repo "$GITHUB_REPOSITORY" --prerelease \
            --target "$GITHUB_SHA" --title "Latest build (for testing)" \
            --notes "Built from $GITHUB_SHA and checked on VirusTotal. Not tested yet: use the newest regular release instead."

      - name: Release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v')
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          v=$(sed -n 's/^project(Queenfisher VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          tag="v$v"
          [ "$(printf '%s' "$SUBJECT" | head -n 1)" = "Release $tag" ] ||
            { echo "The commit says '$SUBJECT' but CMakeLists.txt has version $v"; exit 1; }
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already released; bump the version first."; exit 1
          fi
          # A tag without a release never shipped (pushed too early): it moves to this commit.
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" >/dev/null 2>&1 || true
          # Fixed names too, for the website's download buttons (releases/latest/download/<name>).
          cp "dist/Queenfisher-$v-x86_64.AppImage" dist/Queenfisher-Linux.AppImage
          cp "dist/Queenfisher-$v-windows.exe" dist/Queenfisher-Windows.exe
          cp "dist/Queenfisher-$v-macos.zip" dist/Queenfisher-macOS.zip
          cp "dist/Queenfisher-$v-macos-intel.zip" dist/Queenfisher-macOS-Intel.zip
          cd dist
          sha256sum -- $(ls | grep -vx SHA256SUMS) > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          { cat ../packaging/release-notes.md; echo; cat <<EOF
          ## Download

          **Linux:** download \`Queenfisher-$v-x86_64.AppImage\`, make it executable (\`chmod +x\`) and run it. Needs ffmpeg installed; YouTube also needs Deno.

          **Windows:** download \`Queenfisher-$v-windows.exe\` and run it. It's the whole program, nothing to install.

          **macOS:** download \`Queenfisher-$v-macos.zip\` (Apple Silicon) or \`Queenfisher-$v-macos-intel.zip\` (Intel), open it and open **Queenfisher**. The first time, macOS blocks it: System Settings → Privacy & Security → **Open Anyway**. Needs ffmpeg (\`brew install ffmpeg\`).

          Every file was checked on VirusTotal before this was published. SHA-256 checksums are in \`SHA256SUMS\`.
          EOF
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" * --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Queenfisher $v" --notes-file "$RUNNER_TEMP/notes.md"
